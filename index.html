<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratti</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233D3AF5'/%3E%3Cpath d='M3 19.5V14.6L9 9.1l4.3 2.7L21 4.5v15Z' fill='%23fff' transform='translate(3.36 3.36) scale(0.72)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>

<style>
  :root{
    --canvas:#EDF0F5; --surface:#FFFFFF; --ink:#0B1220; --ink-2:#3A4457;
    --muted:#7C889D; --line:#E4E8EF; --line-2:#F0F3F7;
    --accent:#3D3AF5; --accent-soft:#EDECFE;
    --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
    --serif:'Instrument Serif',Georgia,serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sh-1:0 1px 2px rgba(11,18,32,.04), 0 4px 14px rgba(11,18,32,.055);
    --sh-2:0 2px 6px rgba(11,18,32,.06), 0 16px 34px rgba(11,18,32,.10);
    --pane:320px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .app{display:grid;grid-template-columns:1fr var(--pane);height:100vh;overflow:hidden}
  .work{display:flex;flex-direction:column;overflow:hidden;min-width:0}

  /* top bar */
  .top{display:flex;align-items:center;gap:11px;padding:0 20px;height:60px;flex:none;
    background:var(--surface);border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;letter-spacing:-.03em}
  .mark{width:24px;height:24px;border-radius:7px;background:var(--accent);
    display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(11,18,32,.18)}
  .mark svg{display:block}
  .brandlogo{height:26px;max-width:104px;object-fit:contain;display:block}
  .divide{width:1px;height:22px;background:var(--line);flex:none}
  .deck{min-width:0;flex:1}
  .deck h1{margin:0;font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:-.01em;
    line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .deck h1[contenteditable]:focus{outline:none;background:var(--accent-soft);border-radius:5px;padding:0 5px;margin:0 -5px}
  .deck .meta{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.03em}

  .act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
    padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:500;transition:.15s;white-space:nowrap}
  .act:hover{border-color:var(--ink-2);box-shadow:var(--sh-1)}
  .act-solid{background:var(--accent);border-color:var(--accent);color:#fff}
  .act-solid:hover{filter:brightness(.92)}
  .act-quiet{border:0;background:none;color:var(--muted);padding:6px 8px}
  .act-quiet:hover{color:var(--ink)}
  .act svg{width:14px;height:14px}

  /* filter strip */
  .strip{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 20px;flex:none;
    background:var(--surface);border-bottom:1px solid var(--line)}
  .strip .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .fchip{display:inline-flex;align-items:center;gap:4px;background:var(--canvas);border-radius:22px;padding:4px 6px 4px 12px}
  .fchip select{border:0;background:none;font-size:12.5px;padding:2px;max-width:132px}
  .fchip .x{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:0 5px}
  .fchip .x:hover{color:#E0364F}
  .fchip.live{background:var(--accent);color:#fff;font-size:12.5px;font-weight:500;padding-left:13px}
  .fchip.live .x{color:rgba(255,255,255,.7)}
  .fchip.live .x:hover{color:#fff}

  .scroll{flex:1;overflow-y:auto;padding:20px 20px 34px}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border-radius:14px;padding:16px 18px 12px;box-shadow:var(--sh-1);
    display:flex;flex-direction:column;min-height:118px}
  .kpi .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .val{font-size:32px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin-top:7px;
    font-variant-numeric:tabular-nums}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:2px}
  .kpi .spark{height:26px;margin:6px -4px -2px;position:relative}

  /* blocks */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
  .card{background:var(--surface);border-radius:14px;padding:18px 20px 18px;box-shadow:var(--sh-1);
    display:flex;flex-direction:column;cursor:pointer;position:relative;grid-column:span 6;
    transition:box-shadow .18s;animation:rise .3s cubic-bezier(.2,.7,.3,1)}
  .card:hover{box-shadow:var(--sh-2)}
  .card.sel{box-shadow:var(--sh-2),0 0 0 1.5px var(--accent)}
  .card.dragging{opacity:.35}
  .card.dragover{box-shadow:0 0 0 2px var(--accent)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card-top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .grip{cursor:grab;color:#D3DAE4;font-size:13px;letter-spacing:-3px;user-select:none;flex:none}
  .grip:hover{color:var(--muted)}
  .card-top h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.015em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-top h3[contenteditable]:focus{outline:none;background:var(--accent-soft);border-radius:5px;padding:0 5px;margin:0 -5px}

  .ctrl{display:flex;align-items:center;gap:1px;flex:none;opacity:0;transition:opacity .15s}
  .card:hover .ctrl,.card.sel .ctrl{opacity:1}
  @media (hover:none){.ctrl{opacity:1}}
  .cbtn{border:0;background:none;color:#B9C2D0;width:25px;height:25px;border-radius:7px;
    display:grid;place-items:center;font-size:16px;line-height:1;transition:.14s;padding:0}
  .cbtn:hover{background:var(--canvas);color:var(--ink-2)}
  .cbtn svg{width:15px;height:15px}
  .cbtn.kill:hover{background:#FFECEF;color:#E0364F}

  .plot-wrap{position:relative;width:100%;height:288px;max-height:70vh;
    transition:height .18s cubic-bezier(.2,.7,.3,1)}
  .plot-wrap canvas,.plot-wrap .plot{width:100%!important;height:100%!important}
  .plot-wrap.scrolls{overflow:auto}

  /* resize handles */
  .rs{position:absolute;opacity:0;transition:opacity .15s;z-index:3}
  .card:hover .rs,.card.sel .rs,.card.resizing .rs{opacity:1}
  @media (hover:none){.rs{opacity:1}}
  .rs-b{left:22%;right:22%;bottom:3px;height:8px;cursor:ns-resize;display:grid;place-items:center}
  .rs-b::after{content:"";width:44px;height:3.5px;border-radius:3px;background:#D5DCE6;transition:background .15s}
  .rs-b:hover::after{background:var(--accent)}
  .rs-c{right:4px;bottom:4px;width:17px;height:17px;cursor:nwse-resize}
  .rs-c::after{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;
    border-right:2.2px solid #D5DCE6;border-bottom:2.2px solid #D5DCE6;border-bottom-right-radius:3px;transition:border-color .15s}
  .rs-c:hover::after{border-right-color:var(--accent);border-bottom-color:var(--accent)}
  .card.resizing{box-shadow:var(--sh-2),0 0 0 1.5px var(--accent);user-select:none}
  .card.resizing .plot-wrap{transition:none}
  .readout{position:absolute;right:10px;bottom:10px;background:var(--ink);color:#fff;
    font-family:var(--mono);font-size:10px;padding:4px 8px;border-radius:6px;
    pointer-events:none;opacity:0;transition:opacity .12s;z-index:4}
  .card.resizing .readout{opacity:1}

  /* data table visual */
  .dt{width:100%;border-collapse:collapse;font-size:12.5px}
  .dt th,.dt td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}
  .dt th:first-child,.dt td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
  .dt thead th{position:sticky;top:0;background:var(--surface);z-index:2;cursor:pointer;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);user-select:none}
  .dt thead th:first-child{z-index:3}
  .dt thead th:hover{color:var(--ink)}
  .dt thead th .ar{opacity:.5;font-size:9px;margin-left:3px}
  .dt tbody tr:hover td{background:var(--canvas)}
  .dt tbody tr:hover td:first-child{background:var(--canvas)}
  .dt td{font-variant-numeric:tabular-nums}
  .dt tr.sel-row td{background:var(--accent-soft)!important;color:var(--accent);font-weight:600}
  .dt tfoot td{position:sticky;bottom:0;background:var(--surface);font-weight:600;
    border-top:1.5px solid var(--line);border-bottom:0}

  /* card block */
  .cardviz{display:flex;flex-direction:column;height:100%;justify-content:center;padding:2px 2px 0}
  .cardviz .cv-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cardviz .cv-val{font-weight:600;letter-spacing:-.035em;line-height:1;margin-top:8px;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .cardviz .cv-sub{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .cardviz .cv-pill{font-family:var(--mono);font-size:10px;padding:2.5px 7px;border-radius:20px;font-weight:500}
  .cv-good{background:#E4F6EC;color:#1F7A4C}
  .cv-bad{background:#FDECEE;color:#C0334A}
  .cv-flat{background:var(--canvas);color:var(--muted)}
  .cardviz .cv-spark{height:36px;margin:10px -6px -4px;position:relative}
  .cardviz .cv-meter{height:5px;border-radius:3px;background:var(--line);margin-top:11px;overflow:hidden}
  .cardviz .cv-meter i{display:block;height:100%;border-radius:3px}

  /* slicer block */
  .slicer{display:flex;flex-direction:column;height:100%;gap:8px}
  .slicer .sl-search{width:100%;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--canvas)}
  .slicer .sl-search:focus{outline:none;border-color:var(--accent);background:var(--surface)}
  .slicer .sl-list{overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
  .sl-item{display:flex;align-items:center;gap:9px;padding:5.5px 7px;border-radius:7px;cursor:pointer;
    font-size:12.5px;transition:background .12s}
  .sl-item:hover{background:var(--canvas)}
  .sl-item .box{width:15px;height:15px;border-radius:4.5px;border:1.6px solid #C7D0DC;flex:none;
    display:grid;place-items:center;transition:.12s}
  .sl-item .box svg{width:9px;height:9px;opacity:0;transition:opacity .12s}
  .sl-item.on .box{background:var(--accent);border-color:var(--accent)}
  .sl-item.on .box svg{opacity:1}
  .sl-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sl-item .cnt{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .sl-foot{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line-2);padding-top:8px}
  .sl-foot button{border:0;background:none;font-size:11.5px;color:var(--accent);padding:2px 4px;border-radius:5px}
  .sl-foot button:hover{background:var(--accent-soft)}
  .sl-foot .n{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}

  /* conditional formatting */
  .dt td.cf{position:relative;isolation:isolate}
  .dt td .bar{position:absolute;left:6px;top:50%;transform:translateY(-50%);height:17px;
    border-radius:3px;z-index:-1;opacity:.28}
  .dt td .arrow{font-size:10px;margin-right:5px}

  /* text + image blocks */
  .tb-head{font-family:var(--serif);font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:0 0 8px;outline:none}
  .tb-head:empty::before{content:"Heading";color:#C3CBD8}
  .tb-body{font-size:14px;line-height:1.6;color:var(--ink-2);outline:none;white-space:pre-wrap}
  .tb-body:empty::before{content:"Add a note for your client…";color:#C3CBD8}
  .tb{padding:4px 2px}
  .tb.center{text-align:center}
  .imgbox{display:grid;place-items:center;overflow:hidden}
  .imgbox img{max-width:100%;max-height:100%;object-fit:contain}
  .imgbox.cover img{width:100%;height:100%;object-fit:cover}
  .imgbox .ph{color:var(--muted);font-size:12.5px;text-align:center}

  .blank{background:var(--surface);border-radius:14px;box-shadow:var(--sh-1);padding:60px 34px;text-align:center}
  .blank h2{margin:0 0 8px;font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:-.01em}
  .blank p{margin:0 auto 22px;color:var(--muted);font-size:13.5px;max-width:440px}
  .ideas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .idea{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    padding:7px 13px;border-radius:22px;font-size:12.5px;transition:.15s}
  .idea:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  .ask{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:13px 20px 15px}
  .ask-row{display:flex;gap:10px;align-items:center;max-width:940px;margin:0 auto}
  .ask-row input{flex:1;font-size:14px;padding:12px 16px;border:1px solid var(--line);
    border-radius:11px;background:var(--canvas);transition:.15s}
  .ask-row input:focus{background:var(--surface);border-color:var(--accent);outline:none;
    box-shadow:0 0 0 3px var(--accent-soft)}
  .say{max-width:940px;margin:9px auto 0;font-family:var(--mono);font-size:10.5px;color:var(--muted);min-height:14px}
  .say.bad{color:#E0364F}
  .pip{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);
    margin-right:7px;animation:beat 1s ease-in-out infinite}
  @keyframes beat{0%,100%{opacity:.22}50%{opacity:1}}

  /* right pane */
  .pane{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .pane-top{padding:0 18px;height:60px;display:flex;align-items:center;gap:8px;
    border-bottom:1px solid var(--line);flex:none}
  .pane-top h2{margin:0;font-size:13px;font-weight:600;letter-spacing:-.01em}
  .pane-top .sub{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .pane-body{overflow-y:auto;padding:16px 18px 30px;flex:1}
  .grow{flex:1}
  .sect{margin-bottom:22px}
  .sect:last-child{margin-bottom:0}
  .sect > h4{margin:0 0 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);font-weight:500}

  .field{margin-bottom:9px}
  .field label{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:4px}
  .field select,.field input[type=text],.field input[type=number]{width:100%;font-size:13px;padding:8px 10px;
    border:1px solid var(--line);border-radius:8px;background:var(--surface);transition:.15s}
  .field select:hover{border-color:var(--ink-2)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tsel{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 3px 7px;
    display:flex;flex-direction:column;align-items:center;gap:5px;transition:.15s}
  .tsel:hover{border-color:var(--ink-2)}
  .tsel.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .tsel svg{width:19px;height:19px}
  .tsel span{font-size:8.5px;line-height:1;text-align:center}

  .toggles{display:flex;gap:7px;flex-wrap:wrap}
  .tg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;
    font-size:12px;transition:.15s}
  .tg:hover{border-color:var(--ink-2)}
  .tg.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tg.warn:hover{border-color:#E0364F;color:#E0364F}

  .def{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--canvas);
    border-radius:8px;padding:9px 11px;line-height:1.6;word-break:break-word}
  .def b{color:var(--ink-2);font-weight:500}

  .zone{border:1.5px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;
    background:var(--canvas);transition:.15s}
  .zone.over{border-color:var(--accent);background:var(--accent-soft)}
  .zone p{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
  .loaded{background:var(--accent-soft);border-radius:11px;padding:11px 13px;
    display:flex;align-items:center;justify-content:space-between;gap:9px}
  .loaded b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .loaded span{font-family:var(--mono);font-size:10px;color:var(--muted);display:block;margin-top:1px}

  .fields{list-style:none;margin:0;padding:0}
  .fields li{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:7px 0;
    border-bottom:1px solid var(--line-2)}
  .fields li:last-child{border-bottom:0}
  .fields .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 7px;border-radius:5px;flex:none}
  .p-num{background:#E0F7F4;color:#00796B}
  .p-cat{background:#F1EBFD;color:#7B3FD4}
  .p-date{background:#FFF3DE;color:#B8760C}

  .hintline{font-size:11.5px;color:var(--muted);line-height:1.5;margin:6px 0 0}
  .rng{width:100%;-webkit-appearance:none;appearance:none;background:none;height:20px;cursor:pointer}
  .rng::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:var(--line)}
  .rng::-moz-range-track{height:4px;border-radius:3px;background:var(--line)}
  .rng::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--accent);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(11,18,32,.25);margin-top:-5.5px}
  .rng::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);
    border:2.5px solid #fff;box-shadow:0 1px 4px rgba(11,18,32,.25)}

  /* saved dashboards */
  .saves{list-style:none;margin:0;padding:0}
  .saves li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2)}
  .saves li:last-child{border-bottom:0}
  .saves .nm{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .saves .when{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .mini{border:0;background:none;color:var(--muted);font-size:11.5px;padding:3px 6px;border-radius:6px}
  .mini:hover{background:var(--canvas);color:var(--ink)}
  .mini.warn:hover{background:#FFECEF;color:#E0364F}

  /* theme swatches */
  .swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sw{border:1px solid var(--line);border-radius:10px;padding:9px 6px 8px;background:var(--surface);
    display:flex;flex-direction:column;align-items:center;gap:6px;transition:.15s}
  .sw:hover{border-color:var(--ink-2)}
  .sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .sw .dots{display:flex;gap:2px}
  .sw .dots i{width:9px;height:9px;border-radius:50%;display:block}
  .sw span{font-size:10px;color:var(--ink-2)}
  .colorrow{display:flex;align-items:center;gap:9px}
  .colorrow input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--line);
    border-radius:8px;background:var(--surface);cursor:pointer}

  #paneToggle{display:none}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:1100px){
    .app{grid-template-columns:1fr}
    .pane{position:fixed;top:0;right:0;bottom:0;width:min(336px,90vw);z-index:40;
      transform:translateX(100%);transition:transform .22s ease;box-shadow:var(--sh-2)}
    .pane.open{transform:none}
    #paneToggle{display:inline-flex}
    .card{grid-column:span 12!important}
    .rs{display:none}
    .hide-sm{display:none!important}
  }
  @media (max-width:640px){
    .top{padding:0 13px;gap:8px}
    .deck h1{font-size:18px}
    .scroll{padding:13px 13px 26px}
    .ask{padding:11px 13px 13px}
    .card{padding:15px 16px 16px}
    .plot-wrap{max-height:56vh}
  }
  @media print{
    .top .act,.strip,.ask,.pane,.grip,.ctrl,.rs,.readout{display:none!important}
    .app{display:block;height:auto;overflow:visible}
    .scroll{overflow:visible;padding:0}
    body{background:#fff}
    .card,.kpi{box-shadow:none;border:1px solid var(--line);break-inside:avoid;page-break-inside:avoid}
  }
</style>

<div class="app">
  <section class="work">
    <header class="top">
      <div class="logo" id="brand">
        <span class="mark"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19.5V14.6L9 9.1l4.3 2.7L21 4.5v15Z" fill="#fff"/></svg></span>
        <span id="brandName">Gratti</span>
      </div>
      <span class="divide"></span>
      <div class="deck">
        <h1 contenteditable="true" spellcheck="false" id="deckTitle">Untitled dashboard</h1>
        <div class="meta" id="deckMeta">no data loaded</div>
      </div>
      <button class="act hide-sm" id="addCardBtn" title="Add a KPI card">+ Card</button>
      <button class="act hide-sm" id="addSlicerBtn" title="Add an on-canvas filter">+ Filter</button>
      <button class="act hide-sm" id="addTextBtn" title="Add a text block">+ Text</button>
      <button class="act hide-sm" id="addImgBtn" title="Add an image block">+ Image</button>
      <button class="act hide-sm" id="addFilterBtn" style="display:none">Filter bar</button>
      <button class="act hide-sm" id="themeBtn">Theme</button>
      <button class="act act-solid" id="saveBtn">Save</button>
      <button class="act hide-sm" id="pdfBtn">PDF</button>
      <button class="act" id="paneToggle">Panel</button>
    </header>

    <div class="strip" id="strip" style="display:none">
      <span class="tag">Filters</span>
      <div id="chips" style="display:flex;gap:9px;flex-wrap:wrap;align-items:center"></div>
    </div>

    <div class="scroll" id="scroll">
      <div class="kpis" id="kpis"></div>
      <div id="board"></div>
    </div>

    <div class="ask">
      <div class="ask-row">
        <input id="askInput" autocomplete="off" placeholder="Ask for a chart — “revenue by month, split by location, stacked”">
        <button class="act act-solid" type="button" id="askBtn">Create chart</button>
      </div>
      <div class="say" id="say"></div>
    </div>
  </section>

  <aside class="pane" id="pane">
    <div class="pane-top">
      <div>
        <h2 id="paneTitle">Data</h2>
        <div class="sub" id="paneSub">source &amp; fields</div>
      </div>
      <span class="grow"></span>
      <button class="act-quiet" id="paneClose" style="display:none">Done</button>
    </div>
    <div class="pane-body" id="paneBody"></div>
  </aside>
</div>
